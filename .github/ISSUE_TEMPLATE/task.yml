name: Zadanie
description: Techniczne lub organizacyjne zadanie (porządki, konfiguracja, CI)
title: 'chore: '
labels: ['task']
body:
  - type: textarea
    id: description
    attributes:
      label: Opis zadania
      description: Co trzeba zrobić i dlaczego.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Kryteria akceptacji
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Zależności
      description: Powiązane issues i PR, blokady.
